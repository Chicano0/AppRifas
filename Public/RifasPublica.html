<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas - Participa y Gana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 50%, #000 100%);
            color: white;
            min-height: 100vh;
            padding: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-radius: 15px;
            border: 2px solid #d4af37;
        }

        .header h1 {
            color: #d4af37;
            font-size: clamp(24px, 5vw, 48px);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .header p {
            color: #ccc;
            font-size: clamp(14px, 3vw, 18px);
        }

        .rifas-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .rifa-card {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border: 2px solid #333;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .rifa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
        }

        .rifa-header {
            background: linear-gradient(90deg, #d4af37, #ffd700);
            padding: 4px 0;
        }

        .rifa-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            object-position: center;
            background: rgba(26, 26, 26, 0.8);
            border-bottom: 3px solid #d4af37;
            padding: 10px;
        }

        .rifa-info {
            padding: 20px;
        }

        .rifa-title {
            color: #d4af37;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .rifa-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .detail-item {
            background: rgba(26, 26, 26, 0.5);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #444;
            text-align: center;
        }

        .detail-label {
            color: #d4af37;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .detail-value {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .precio-destacado {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            font-size: 16px;
        }

        .boletos-section {
            margin-top: 20px;
        }

        .boletos-title {
            color: #d4af37;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .boletos-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background: rgba(26, 26, 26, 0.7);
            padding: 10px;
            border-radius: 10px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            color: #d4af37;
            font-size: 16px;
            font-weight: bold;
        }

        .stat-label {
            color: #ccc;
            font-size: 11px;
        }

        .boletos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .boleto {
            width: 50px;
            height: 35px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
            transition: all 0.3s ease;
            background: white;
            color: #000;
        }

        .boleto.disponible {
            background: white;
            color: #000;
            border-color: #d4af37;
        }

        .boleto.disponible:hover {
            background: #d4af37;
            color: white;
            transform: scale(1.1);
        }

        .boleto.seleccionado {
            background: #d4af37;
            color: white;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .boleto.ocupado {
            background: #000000 !important;
            color: #666 !important;
            border-color: #333 !important;
            cursor: not-allowed;
        }

        .boleto.ocupado:hover {
            transform: none;
        }

        .boletos-seleccionados {
            margin-top: 15px;
            padding: 15px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px;
            border: 1px solid #d4af37;
        }

        .comprar-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .comprar-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .comprar-btn:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #28a745;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Modal Mejorado */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            padding: 10px;
            overflow-y: auto;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            margin: 10px auto;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            border: 2px solid #d4af37;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(90deg, #d4af37, #ffd700);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            border-radius: 15px 15px 0 0;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #d4af37;
            cursor: pointer;
            z-index: 10;
        }

        .close-btn:hover {
            color: #ffd700;
        }

        .modal h2 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
            font-size: clamp(18px, 4vw, 24px);
            padding-top: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #444;
            border-radius: 10px;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .boletos-resumen {
            background: rgba(212, 175, 55, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #d4af37;
            font-size: 14px;
        }

        .boletos-resumen h4 {
            color: #d4af37;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .boletos-resumen div {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .enviar-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .enviar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #d4af37;
            font-size: 18px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #d4af37;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls-section {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .controls-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #d4af37, #ffd700);
        }

        .navigation-links {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 30px;
        }

        .nav-link {
            color: #d4af37;
            text-decoration: none;
            font-weight: 500;
            margin: 0 15px;
            transition: all 0.3s ease;
            display: inline-block;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .nav-link:hover {
            background: rgba(212, 175, 55, 0.1);
            color: #ffd700;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .rifas-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .rifa-details {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            
            .boletos-grid {
                grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
                gap: 4px;
            }
            
            .boleto {
                width: 45px;
                height: 32px;
                font-size: 9px;
            }

            .modal-content {
                margin: 5px auto;
                padding: 15px;
                width: calc(100% - 10px);
                max-width: none;
            }

            .form-group input {
                padding: 10px 12px;
                font-size: 16px; /* Previene zoom en iOS */
            }

            .rifa-image {
                height: 150px;
                padding: 8px;
            }

            .rifa-info {
                padding: 15px;
            }

            .nav-link {
                display: block;
                margin: 5px 0;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                border-radius: 10px;
                margin: 0;
                width: 100%;
                height: 100vh;
                overflow-y: auto;
            }

            .boletos-grid {
                grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            }

            .boleto {
                width: 40px;
                height: 28px;
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>🎲 RIFAS PREMIUM</h1>
        <p>Participa en nuestras rifas y gana increíbles premios</p>
    </div>

    <section class="navigation-links">
        <a href="index.html" class="nav-link">🏠 Volver al Inicio</a>
    </section>

    <!-- Loading -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        Cargando rifas disponibles...
    </div>

    <!-- Rifas Container -->
    <div id="rifas-container" class="rifas-container" style="display: none;">
        <!-- Se llenarán dinámicamente -->
    </div>

    <!-- Modal de Compra -->
    <div id="modal-compra" class="modal">
        <div class="modal-content">
            <div class="modal-header"></div>
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <h2>🛒 Completar Compra</h2>
            
            <div id="resumen-boletos" class="boletos-resumen">
                <!-- Se llenará dinámicamente -->
            </div>

            <form id="form-compra">
                <div class="form-group">
                    <label for="nombre">👤 Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
                </div>

                <div class="form-group">
                    <label for="telefono">📱 WhatsApp (10 dígitos):</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="8441234567" pattern="[0-9]{10}">
                </div>

                <div class="form-group">
                    <label for="direccion">🏠 Dirección:</label>
                    <input type="text" id="direccion" name="direccion" required placeholder="Calle, colonia, ciudad">
                </div>

                <div class="form-group">
                    <label for="estado">📍 Estado:</label>
                    <input type="text" id="estado" name="estado" required placeholder="Estado donde resides">
                </div>

                <button type="submit" class="enviar-btn">
                    📲 Enviar por WhatsApp
                </button>
            </form>
        </div>
    </div>

    <script>
        // Variables globales
        let rifasData = [];
        let boletosSeleccionados = {};
        let rifaActual = null;

        // Cargar rifas al iniciar
        window.addEventListener('DOMContentLoaded', cargarRifas);

        async function cargarRifas() {
            try {
               const response = await fetch('/rifas/activas');

                if (!response.ok) throw new Error('Error al cargar rifas');
                
                const rifas = await response.json();
                rifasData = rifas; // Ya vienen filtradas solo las activas
                
                mostrarRifas();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #dc3545;">
                        ❌ Error al cargar las rifas. Por favor recarga la página.
                    </div>
                `;
            }
        }

        function mostrarRifas() {
            const container = document.getElementById('rifas-container');
            const loading = document.getElementById('loading');
            
            if (rifasData.length === 0) {
                loading.innerHTML = `
                    <div style="color: #ffd700;">
                        📭 No hay rifas disponibles en este momento.
                        <br><br>
                        <small>Vuelve pronto para participar en nuestras rifas.</small>
                    </div>
                `;
                return;
            }
            
            loading.style.display = 'none';
            container.style.display = 'grid';

            container.innerHTML = rifasData.map(rifa => {
                const fecha = new Date(rifa.fecha_sorteo).toLocaleDateString('es-ES', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const imagenBase64 = arrayBufferToBase64(rifa.imagen.data.data);
                const boletosOcupados = rifa.boletosOcupados || [];
                const boletosDisponibles = rifa.cantidad_boletos - boletosOcupados.length;

                return `
                    <div class="rifa-card">
                        <div class="rifa-header"></div>
                        <div class="status-badge">🟢 ACTIVA</div>
                        
                        <img src="data:${rifa.imagen.contentType};base64,${imagenBase64}" 
                             alt="${rifa.titulo}" class="rifa-image">
                        
                        <div class="rifa-info">
                            <h3 class="rifa-title">${rifa.titulo}</h3>
                            
                            <div class="rifa-details">
                                <div class="detail-item">
                                    <div class="detail-label">📅 FECHA</div>
                                    <div class="detail-value">${fecha}</div>
                                </div>
                                
                                <div class="detail-item">
                                    <div class="detail-label">🕐 HORA</div>
                                    <div class="detail-value">${rifa.hora_sorteo}</div>
                                </div>
                                
                                <div class="detail-item">
                                    <div class="detail-label">🏷️ CATEGORÍA</div>
                                    <div class="detail-value">${rifa.categoria}</div>
                                </div>
                                
                                <div class="detail-item precio-destacado">
                                    <div class="detail-label">💰 PRECIO</div>
                                    <div class="detail-value">${parseFloat(rifa.precio).toFixed(2)}</div>
                                </div>
                            </div>

                            <div class="boletos-section">
                                <h4 class="boletos-title">🎟️ Selecciona tus boletos</h4>
                                
                                <div class="boletos-stats">
                                    <div class="stat">
                                        <div class="stat-value">${rifa.cantidad_boletos}</div>
                                        <div class="stat-label">Total</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-value" id="disponibles-${rifa._id}">${boletosDisponibles}</div>
                                        <div class="stat-label">Disponibles</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-value" id="seleccionados-${rifa._id}">0</div>
                                        <div class="stat-label">Seleccionados</div>
                                    </div>
                                </div>

                                <div class="boletos-grid" id="boletos-${rifa._id}">
                                    ${generarBoletos(rifa)}
                                </div>

                                <div class="boletos-seleccionados" id="resumen-${rifa._id}" style="display: none;">
                                    <strong>Boletos seleccionados:</strong>
                                    <div id="lista-seleccionados-${rifa._id}"></div>
                                    <div style="margin-top: 10px;">
                                        <strong>Total: $<span id="total-${rifa._id}">0.00</span></strong>
                                    </div>
                                </div>

                                <button class="comprar-btn" id="btn-${rifa._id}" 
                                        onclick="abrirModalCompra('${rifa._id}')" disabled>
                                    🛒 Comprar Boletos Seleccionados
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Inicializar boletos seleccionados
            rifasData.forEach(rifa => {
                boletosSeleccionados[rifa._id] = [];
            });
        }

        function generarBoletos(rifa) {
            const boletosOcupados = rifa.boletosOcupados || [];
            let html = '';

            for (let i = 1; i <= rifa.cantidad_boletos; i++) {
                const numeroCompleto = i.toString().padStart(5, '0');
                const isOcupado = boletosOcupados.includes(i);
                const clase = isOcupado ? 'ocupado' : 'disponible';
                
                html += `
                    <div class="boleto ${clase}" 
                         data-rifa="${rifa._id}" 
                         data-numero="${i}"
                         onclick="${isOcupado ? '' : `toggleBoleto('${rifa._id}', ${i})`}">
                        ${numeroCompleto}
                    </div>
                `;
            }

            return html;
        }

        function toggleBoleto(rifaId, numero) {
            const boleto = document.querySelector(`[data-rifa="${rifaId}"][data-numero="${numero}"]`);
            if (!boleto || boleto.classList.contains('ocupado')) return;

            const index = boletosSeleccionados[rifaId].indexOf(numero);
            
            if (index > -1) {
                // Deseleccionar
                boletosSeleccionados[rifaId].splice(index, 1);
                boleto.classList.remove('seleccionado');
                boleto.classList.add('disponible');
            } else {
                // Seleccionar
                boletosSeleccionados[rifaId].push(numero);
                boleto.classList.remove('disponible');
                boleto.classList.add('seleccionado');
            }

            actualizarResumen(rifaId);
        }

        function actualizarResumen(rifaId) {
            const seleccionados = boletosSeleccionados[rifaId];
            const rifa = rifasData.find(r => r._id === rifaId);
            
            // Actualizar contador
            document.getElementById(`seleccionados-${rifaId}`).textContent = seleccionados.length;
            
            // Actualizar resumen
            const resumen = document.getElementById(`resumen-${rifaId}`);
            const lista = document.getElementById(`lista-seleccionados-${rifaId}`);
            const total = document.getElementById(`total-${rifaId}`);
            const boton = document.getElementById(`btn-${rifaId}`);

            if (seleccionados.length > 0) {
                resumen.style.display = 'block';
                lista.innerHTML = seleccionados
                    .sort((a, b) => a - b)
                    .map(num => `<span style="background: #d4af37; color: #000; padding: 2px 8px; border-radius: 10px; margin: 2px; display: inline-block;">${num.toString().padStart(5, '0')}</span>`)
                    .join('');
                
                const totalAmount = seleccionados.length * parseFloat(rifa.precio);
                total.textContent = totalAmount.toFixed(2);
                
                boton.disabled = false;
                boton.textContent = `🛒 Comprar ${seleccionados.length} Boleto${seleccionados.length > 1 ? 's' : ''} - $${totalAmount.toFixed(2)}`;
            } else {
                resumen.style.display = 'none';
                boton.disabled = true;
                boton.textContent = '🛒 Comprar Boletos Seleccionados';
            }
        }

        function abrirModalCompra(rifaId) {
            if (!boletosSeleccionados[rifaId] || boletosSeleccionados[rifaId].length === 0) {
                return;
            }

            rifaActual = rifaId;
            const rifa = rifasData.find(r => r._id === rifaId);
            const seleccionados = boletosSeleccionados[rifaId];
            const total = seleccionados.length * parseFloat(rifa.precio);

            // Llenar resumen
            document.getElementById('resumen-boletos').innerHTML = `
                <h4>📋 Resumen de Compra</h4>
                <div><strong>🎯 Rifa:</strong> ${rifa.titulo}</div>
                <div><strong>🎟️ Boletos:</strong> ${seleccionados.map(n => n.toString().padStart(5, '0')).join(', ')}</div>
                <div><strong>📊 Cantidad:</strong> ${seleccionados.length} boleto${seleccionados.length > 1 ? 's' : ''}</div>
                <div><strong>💵 Precio unitario:</strong> $${parseFloat(rifa.precio).toFixed(2)}</div>
                <div style="font-size: 16px; color: #d4af37; margin-top: 8px;"><strong>💰 Total a pagar: $${total.toFixed(2)}</strong></div>
            `;

            document.getElementById('modal-compra').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal-compra').style.display = 'none';
            document.getElementById('form-compra').reset();
            document.body.style.overflow = 'auto';
            rifaActual = null;
        }

        // Form submit
        document.getElementById('form-compra').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!rifaActual || !boletosSeleccionados[rifaActual] || boletosSeleccionados[rifaActual].length === 0) {
                alert('Error: No hay boletos seleccionados');
                return;
            }

            const formData = new FormData(this);
            const rifa = rifasData.find(r => r._id === rifaActual);
            const seleccionados = boletosSeleccionados[rifaActual];
            const total = seleccionados.length * parseFloat(rifa.precio);

            // Formatear fecha para el mensaje
            const fechaSorteo = new Date(rifa.fecha_sorteo).toLocaleDateString('es-ES', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const mensaje = `
🎲 *¡NUEVA PARTICIPACIÓN EN RIFA!*

═══════════════════════════

👤 *DATOS DEL PARTICIPANTE*
• Nombre: ${formData.get('nombre')}
• WhatsApp: ${formData.get('telefono')}
• Dirección: ${formData.get('direccion')}
• Estado: ${formData.get('estado')}

═══════════════════════════

🎯 *DETALLES DE LA RIFA*
• Título: ${rifa.titulo}
• Categoría: ${rifa.categoria}
• Fecha del sorteo: ${fechaSorteo}
• Hora: ${rifa.hora_sorteo}

═══════════════════════════

🎟️ *BOLETOS SELECCIONADOS*
${seleccionados.sort((a, b) => a - b).map(n => `• Boleto N°: ${n.toString().padStart(5, '0')}`).join('\n')}

═══════════════════════════

💰 *RESUMEN DE PAGO*
• Cantidad de boletos: ${seleccionados.length}
• Precio por boleto: ${parseFloat(rifa.precio).toFixed(2)}
• *TOTAL A PAGAR: ${total.toFixed(2)}*

═══════════════════════════

✨ _¡Gracias por participar en nuestras rifas!_
_Te contactaremos pronto para confirmar tu participación._

🏆 *¡Buena suerte!* 🍀
            `.trim();

            const url = `https://wa.me/528446798889?text=${encodeURIComponent(mensaje)}`;
            
            // Marcar boletos como ocupados temporalmente
            seleccionados.forEach(numero => {
                const boleto = document.querySelector(`[data-rifa="${rifaActual}"][data-numero="${numero}"]`);
                if (boleto) {
                    boleto.classList.remove('seleccionado');
                    boleto.classList.add('ocupado');
                    boleto.onclick = null;
                }
            });

            // Limpiar selección
            boletosSeleccionados[rifaActual] = [];
            actualizarResumen(rifaActual);

            // Abrir WhatsApp
            window.open(url, '_blank');
            
            // Cerrar modal
            cerrarModal();
            
            alert('¡Boletos reservados! Se ha abierto WhatsApp para enviar tu información. Una vez que envíes el mensaje, tus boletos quedarán confirmados.');
        });

        // Funciones auxiliares
        function arrayBufferToBase64(buffer) {
            const binary = new Uint8Array(buffer).reduce((data, byte) => data + String.fromCharCode(byte), '');
            return window.btoa(binary);
        }

        // Cerrar modal con click fuera
        window.onclick = function(event) {
            const modal = document.getElementById('modal-compra');
            if (event.target === modal) {
                cerrarModal();
            }
        };

        // Cerrar modal con Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarModal();
            }
        });

        // Prevenir zoom en dispositivos móviles
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
